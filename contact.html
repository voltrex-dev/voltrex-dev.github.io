	<body>

		<div id="wrapper-contact">
			<header>

				<h1>Green Oasis Lawn Care</h1>

			</header>

			<nav>

				<ul>

				</ul>
		
			</nav>
		
			<main>

				<h2>Contact Us Today</h2>


                <p>Required fields are marked with an asterisk *</p>
                <form name="test" method="post" action="https://webdevbasics.net/scripts/demo.php">
                    <label for="myFirstname-ID">*First Name: </label>
                    <input type="text" name="Firstname" id="myFirstname-ID" required>

                    <label for="myLastname-ID">*Last Name: </label>
                    <input type="text" name="Lastname" id="myLastname-ID" required>

                    <label for="E-mail-ID">*E-mail Address: </label>
                    <input type="email" name="E-mail" id="E-mail-ID" required>

                    <label for="Phone-Number-ID">Phone Number: </label>
                    <input type="tel" name="Phone-Number" id="Phone-Number-ID" maxlength="12">

                    <label for="option1-ID">*Small Lawn</label>
                    <input type="radio" name="SmallLawn" id="option1-ID" required>
                    <br>

                    <label for="option2-ID">*Medium Lawn</label>
                    <input type="radio" name="MediumLawn" id="option2-ID">
                    <br>

                    <label for="option3-ID">*Large Lawn</label>
                    <input type="radio" name="LargeLawn" id="option3-ID">
                    <br>

                    <label for="myComments-ID">Extra Info: </label>
                    <textarea name="myComments" id="myComments-ID" rows="2" cols="30"></textarea>  
                    
                    <input type="submit">
                </form>   
		
			</main>
